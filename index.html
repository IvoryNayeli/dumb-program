<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dumb-program</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0e12;
    --window-bg: #111318;
    --border: #2a2d35;
    --titlebar: #1a1d24;
    --text: #cdd6f4;
    --muted: #45475a;
    --ts: #585b70;
    --blue: #89b4fa;
    --red: #f38ba8;
    --green: #a6e3a1;
    --yellow: #f9e2af;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
    padding: 8px;
  }

  .window {
    width: min(680px, calc(100vw - 16px));
    height: calc(100dvh - 16px);
    max-height: 760px;
    background: var(--window-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 24px 80px rgba(0,0,0,0.6);
  }

  /* ── TITLE BAR ── */
  .titlebar {
    background: var(--titlebar);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    user-select: none;
  }

  .dots { display: flex; gap: 6px; flex-shrink: 0; }
  .dot  { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #f38ba8; }
  .dot-y { background: #f9e2af; }
  .dot-g { background: #a6e3a1; }

  .title-label {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 34px;
  }

  /* ── TERMINAL BODY ── */
  .terminal {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 14px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .terminal::-webkit-scrollbar { width: 4px; }
  .terminal::-webkit-scrollbar-track { background: transparent; }
  .terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── LOG LINE ── */
  .line {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    margin-bottom: 1px;
    font-size: 12px;
    line-height: 1.6;
  }

  .line.visible { opacity: 1; transform: none; }

  .ts {
    color: var(--ts);
    font-size: 11px;
    flex-shrink: 0;
    margin-right: 6px;
    white-space: nowrap;
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    margin-right: 8px;
    width: 7ch;
  }

  .badge-INFO    { color: var(--blue); }
  .badge-ERROR   { color: var(--red); }
  .badge-SUCCESS { color: var(--green); }

  .msg {
    color: var(--text);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    flex: 1;
  }

  .cmd-line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .cmd-line.visible { opacity: 1; transform: none; }

  .cmd-prompt {
    color: var(--green);
    flex-shrink: 0;
    font-weight: 700;
  }

  .cmd-text {
    flex: 1;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  /* ── PROGRESS ROW (style log texte) ── */
  .prog-line {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transition: opacity 0.15s;
    margin-bottom: 1px;
    font-size: 11px;
    line-height: 1.6;
  }

  .prog-line.visible { opacity: 1; }

  /* espace pour aligner sous les messages (ts + badge) */
  .prog-indent {
    flex-shrink: 0;
    /* largeur = ts (8ch) + gap(6px) + badge(7ch) + gap(8px) ≈ visuel */
    width: calc(8ch + 6px + 7ch + 8px);
    color: transparent;
    user-select: none;
    font-size: 11px;
  }

  .prog-bar {
    color: var(--text);
    letter-spacing: 0;
    flex-shrink: 0;
  }

  .prog-pct {
    color: var(--muted);
    margin-left: 6px;
    flex-shrink: 0;
    width: 4ch;
  }

  .prog-pct.ok { color: var(--green); font-weight: 700; }
  .prog-pct.ko { color: var(--red); font-weight: 700; }

  .status-line {
    margin-top: 4px;
    margin-bottom: 2px;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre;
    overflow: hidden;
    text-overflow: clip;
  }

  .status-line.failed { color: var(--red); }
  .status-line.success { color: var(--green); }

  /* ── PUNCHLINE ── */
  .punchline {
    margin-top: 18px;
    margin-bottom: 4px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-size: 12px;
  }

  .punchline.visible { opacity: 1; transform: none; }

  .punchline-icon { flex-shrink: 0; margin-top: 2px; }
  .punchline-icon.err { color: var(--red); }
  .punchline-icon.ok  { color: var(--green); }

  .punchline-text { font-style: italic; line-height: 1.5; }
  .punchline-text.err { color: var(--red); }
  .punchline-text.ok  { color: var(--green); }

  /* ── CURSOR ── */
  .cursor {
    display: inline-block;
    width: 7px; height: 13px;
    background: var(--blue);
    border-radius: 1px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .cursor.visible { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── ACTION BAR ── */
  .actions {
    padding: 9px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-start;
    align-items: center;
    background: var(--titlebar);
    flex-shrink: 0;
    min-height: 44px;
  }

  .btn {
    display: none;
    background: rgba(137,180,250,0.1);
    border: 1px solid rgba(137,180,250,0.25);
    padding: 6px 14px;
    border-radius: 5px;
    color: var(--blue);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 0.03em;
  }

  .btn:hover {
    background: rgba(137,180,250,0.18);
    border-color: rgba(137,180,250,0.45);
  }

  .btn::before { content: "$ "; opacity: 0.5; }
  .btn.show { display: inline-block; }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    html, body {
      padding: 6px;
      align-items: center;
      justify-content: center;
    }

    .window {
      width: calc(100vw - 12px);
      height: calc(100dvh - 12px);
      border-radius: 8px;
    }

    .ts { display: none; }

    /* sur mobile l'indent disparaît puisque ts est caché */
    .prog-indent { width: calc(7ch + 8px); }
  }
</style>
</head>

<body>
<div class="window">
  <div class="titlebar">
    <div class="dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="title-label">bash — dumb-program</div>
  </div>

  <div class="terminal" id="terminal">
    <span class="cursor" id="cursor"></span>
  </div>

  <div class="actions">
    <button class="btn show" id="retryBtn" onclick="runAttempt()">start</button>
  </div>
</div>

<script>
const terminal = document.getElementById("terminal");
const retryBtn = document.getElementById("retryBtn");
const cursor   = document.getElementById("cursor");

const TOTAL   = 5;   // 4 erreurs + 1 succès
const BAR_W   = 20;

const steps = [
  "Initialisation du programme",
  "Chargement des modules essentiels…",
  "Connexion aux services…",
  "Démarrage des dépendances…"
];

const errors = [
  { code: "TypeError",              text: "unsupported operand type(s) for +: 'me' and 'loneliness'", punchline: "J'ai besoin de toi pour corriger ça."   },
  { code: "AttributeError",         text: "'heart' object has no attribute 'control'",                punchline: "Depuis que je t'ai vu, c'est le chaos ici."         },
  { code: "500 Internal Server Error", text: "unexpected input",                      punchline: "Désolée, mon cœur bug quand tu me regardes."        },
  { code: "403 Forbidden",          text: "access denied",                         punchline: "C'est interdit d'être aussi séduisant que toi ou quoi ?"       }
];

let attempt = 0;
let running = false;

const now = () => new Date().toLocaleTimeString('fr-FR', { hour12: false });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ins   = el => terminal.insertBefore(el, cursor);

function bar(pct) {
  const f = Math.round(pct / 100 * BAR_W);
  return "[" + "#".repeat(f) + "-".repeat(BAR_W - f) + "]";
}

function setButton(label) {
  retryBtn.textContent = label;
  retryBtn.classList.add("show");
  retryBtn.disabled = false;
}

function hideButton() {
  retryBtn.classList.remove("show");
}

function estimateCols() {
  const probe = document.createElement("span");
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.whiteSpace = "pre";
  probe.textContent = "M";
  terminal.appendChild(probe);
  const charW = probe.getBoundingClientRect().width || 7;
  terminal.removeChild(probe);
  return Math.max(20, Math.floor((terminal.clientWidth - 2) / charW));
}

function fullStatusLine(label) {
  const cols = estimateCols();
  const core = ` ${label} `;
  const fill = Math.max(0, cols - core.length);
  const left = Math.floor(fill / 2);
  const right = fill - left;
  return "=".repeat(left) + core + "=".repeat(right);
}

async function promptLine(text) {
  const el = document.createElement("div");
  el.className = "cmd-line";
  el.innerHTML =
    `<span class="cmd-prompt">$</span>` +
    `<span class="cmd-text">${text}</span>`;
  ins(el);
  await sleep(20);
  el.classList.add("visible");
  terminal.scrollTop = terminal.scrollHeight;
}

async function log(level, msg) {
  const el = document.createElement("div");
  el.className = "line";
  el.innerHTML =
    `<span class="ts">${now()}</span>` +
    `<span class="badge badge-${level}">${level}</span>` +
    `<span class="msg">${msg}</span>`;
  ins(el);
  await sleep(20);
  el.classList.add("visible");
  terminal.scrollTop = terminal.scrollHeight;
}

async function progress(duration, failAtPct = null) {
  const row    = document.createElement("div");
  row.className = "prog-line";

  const indent = document.createElement("span");
  indent.className = "prog-indent";
  indent.textContent = now() + "  INFO   "; // invisible mais même largeur

  const barEl = document.createElement("span");
  barEl.className = "prog-bar";
  barEl.textContent = bar(0);

  const pctEl = document.createElement("span");
  pctEl.className = "prog-pct";
  pctEl.textContent = "0%";

  row.appendChild(indent);
  row.appendChild(barEl);
  row.appendChild(pctEl);
  ins(row);

  await sleep(20);
  row.classList.add("visible");

  const start = Date.now();
  while (true) {
    const pct = Math.min(100, Math.round((Date.now() - start) / duration * 100));
    barEl.textContent = bar(pct);
    pctEl.textContent = pct + "%";
    terminal.scrollTop = terminal.scrollHeight;
    if (failAtPct !== null && pct >= failAtPct) {
      pctEl.textContent = "KO";
      pctEl.classList.add("ko");
      terminal.scrollTop = terminal.scrollHeight;
      return false;
    }
    if (pct >= 100) break;
    await sleep(40);
  }
  pctEl.textContent = "OK";
  pctEl.classList.add("ok");
  terminal.scrollTop = terminal.scrollHeight;
  return true;
}

async function statusLine(success) {
  const el = document.createElement("div");
  el.className = "status-line " + (success ? "success" : "failed");
  el.textContent = fullStatusLine(success ? "SUCCESS" : "FAILED");
  ins(el);
  terminal.scrollTop = terminal.scrollHeight;
}

async function punchline(text, success) {
  await sleep(350);
  const cls = success ? "ok" : "err";
  const el  = document.createElement("div");
  el.className = "punchline";
  el.innerHTML =
    `<span class="punchline-icon ${cls}">${success ? "✓" : "✗"}</span>` +
    `<span class="punchline-text ${cls}">${text}</span>`;
  ins(el);
  await sleep(30);
  el.classList.add("visible");
  terminal.scrollTop = terminal.scrollHeight;
}

async function runAttempt() {
  if (running) return;
  running = true;
  hideButton();
  cursor.classList.remove("visible");

  const n = attempt + 1;
  const failingStep = attempt < errors.length ? attempt : -1;

  await promptLine(`./dumb-program --attempt ${n}`);
  await log("INFO", `Tentative ${n}/${TOTAL}`);
  await sleep(180);

  for (let i = 0; i < steps.length; i++) {
    await log("INFO", steps[i]);
    const shouldFail = i === failingStep;
    const ok = await progress(
      850 + Math.random() * 550,
      shouldFail ? Math.round(35 + Math.random() * 45) : null
    );

    if (!ok) {
      const err = errors[failingStep];
      await sleep(180);
      await log("ERROR", `${err.code}: ${err.text}`);
      await statusLine(false);
      cursor.classList.remove("visible");
      await punchline(err.punchline, false);

      attempt++;
      running = false;
      setButton("retry");
      return;
    }
  }

  await sleep(280);
  await log("SUCCESS", "connection established — all systems nominal");
  await statusLine(true);
  cursor.classList.remove("visible");
  await punchline("On dirait que ça colle bien entre nous.", true);

  attempt = 0;
  running = false;
  setButton("start");
}

setButton("start");
</script>
</body>
</html>
