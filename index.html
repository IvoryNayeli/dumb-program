<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dumb-program</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #c9d1d9;
    font-family: monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .terminal {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.6;
  }

  .line {
    opacity: 0;
    transform: translateY(4px);
    transition: 0.2s;
    white-space: pre-wrap;
  }

  .visible {
    opacity: 1;
    transform: translateY(0);
  }

  .info { color: #58a6ff; }
  .error { color: #f85149; }
  .success { color: #3fb950; }

  .actions {
    padding: 12px;
    border-top: 1px solid #222;
    display: flex;
    justify-content: center;
  }

  button {
    background: #238636;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    display: none;
  }

  button.show {
    display: block;
  }

  button:active {
    transform: scale(0.97);
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: #58a6ff;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>

<body>

<div class="terminal" id="terminal"></div>

<div class="actions">
  <button id="retryBtn" onclick="start()">Réessayer</button>
</div>

<script>

const sequences = [
  [
    { type: "info", text: "Running program..." },
    { type: "error", text: "TypeError: unsupported operand type(s) for +: 'me' and 'loneliness'" },
    { type: "error", text: "Je pense que j’ai besoin de toi pour corriger ça." },
  ],
  [
    { type: "info", text: "Retrying..." },
    { type: "error", text: "AttributeError: 'heart' object has no attribute 'control'" },
    { type: "error", text: "Depuis que je t’ai vu, c’est le chaos." },
  ],
  [
    { type: "info", text: "Retrying..." },
    { type: "error", text: "500 Internal Server Error" },
    { type: "error", text: "Désolé, mon cœur bug quand tu me regardes." },
  ],
  [
    { type: "info", text: "Retrying..." },
    { type: "error", text: "403 Forbidden" },
    { type: "error", text: "C’est interdit d’être aussi séduisant que toi ou quoi ?" },
  ],
  [
    { type: "info", text: "Final attempt..." },
    { type: "success", text: "Success: connection established" },
    { type: "success", text: "On dirait que ça colle bien entre nous." },
  ]
];

let terminal = document.getElementById("terminal");
let retryBtn = document.getElementById("retryBtn");
let step = 0;

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function printLine(text, type) {
  const line = document.createElement("div");
  line.className = "line " + type;
  line.textContent = text;
  terminal.appendChild(line);

  await sleep(50);
  line.classList.add("visible");

  terminal.scrollTop = terminal.scrollHeight;
}

async function runSequence(seq) {
  retryBtn.classList.remove("show");

  for (let line of seq) {
    await printLine(line.text, line.type);
    await sleep(700);
  }

  // bouton apparaît sauf à la fin
  if (step < sequences.length - 1) {
    retryBtn.classList.add("show");
  } else {
    const cursor = document.createElement("div");
    cursor.innerHTML = '<span class="cursor"></span>';
    cursor.className = "line visible";
    terminal.appendChild(cursor);
  }
}

async function start() {
  terminal.innerHTML = "";
  await runSequence(sequences[step]);
  step++;
  if (step >= sequences.length) step = 0;
}

// lancement auto au chargement
start();

</script>

</body>
</html>
