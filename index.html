<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dumb-program</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0e12;
    --window-bg: #111318;
    --border: #2a2d35;
    --titlebar: #1a1d24;
    --text: #cdd6f4;
    --muted: #45475a;
    --ts: #585b70;
    --blue: #89b4fa;
    --red: #f38ba8;
    --green: #a6e3a1;
    --yellow: #f9e2af;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
    padding: 12px;
  }

  .window {
    width: 100%;
    max-width: 680px;
    height: 440px;           /* taille fixe */
    background: var(--window-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 24px 80px rgba(0,0,0,0.6);
  }

  /* ── TITLE BAR ── */
  .titlebar {
    background: var(--titlebar);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    user-select: none;
  }

  .dots { display: flex; gap: 6px; flex-shrink: 0; }
  .dot  { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #f38ba8; }
  .dot-y { background: #f9e2af; }
  .dot-g { background: #a6e3a1; }

  .title-label {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-right: 34px;
  }

  /* ── TERMINAL BODY ── */
  .terminal {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .terminal::-webkit-scrollbar { width: 4px; }
  .terminal::-webkit-scrollbar-track { background: transparent; }
  .terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── LOG LINE ── */
  .line {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.15s ease, transform 0.15s ease;
    margin-bottom: 1px;
    font-size: 12px;
    line-height: 1.6;
  }

  .line.visible { opacity: 1; transform: none; }

  .ts {
    color: var(--ts);
    font-size: 11px;
    flex-shrink: 0;
    margin-right: 6px;
    white-space: nowrap;
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    margin-right: 8px;
    width: 7ch;
  }

  .badge-INFO    { color: var(--blue); }
  .badge-ERROR   { color: var(--red); }
  .badge-SUCCESS { color: var(--green); }

  .msg {
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
    flex: 1;
  }

  /* ── PROGRESS ROW (style log texte) ── */
  .prog-line {
    display: flex;
    align-items: baseline;
    opacity: 0;
    transition: opacity 0.15s;
    margin-bottom: 1px;
    font-size: 11px;
    line-height: 1.6;
  }

  .prog-line.visible { opacity: 1; }

  /* espace pour aligner sous les messages (ts + badge) */
  .prog-indent {
    flex-shrink: 0;
    /* largeur = ts (8ch) + gap(6px) + badge(7ch) + gap(8px) ≈ visuel */
    width: calc(8ch + 6px + 7ch + 8px);
    color: transparent;
    user-select: none;
    font-size: 11px;
  }

  .prog-bar {
    color: var(--blue);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .prog-pct {
    color: var(--muted);
    margin-left: 6px;
    flex-shrink: 0;
    width: 4ch;
  }

  /* ── PUNCHLINE ── */
  .punchline {
    margin-top: 18px;
    margin-bottom: 4px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    font-size: 12px;
  }

  .punchline.visible { opacity: 1; transform: none; }

  .punchline-icon { flex-shrink: 0; margin-top: 2px; }
  .punchline-icon.err { color: var(--red); }
  .punchline-icon.ok  { color: var(--green); }

  .punchline-text { font-style: italic; line-height: 1.5; }
  .punchline-text.err { color: var(--red); }
  .punchline-text.ok  { color: var(--green); }

  /* ── CURSOR ── */
  .cursor {
    display: inline-block;
    width: 7px; height: 13px;
    background: var(--blue);
    border-radius: 1px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .cursor.visible { opacity: 1; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── ACTION BAR ── */
  .actions {
    padding: 9px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-start;
    align-items: center;
    background: var(--titlebar);
    flex-shrink: 0;
    min-height: 44px;
  }

  .btn {
    display: none;
    background: rgba(137,180,250,0.1);
    border: 1px solid rgba(137,180,250,0.25);
    padding: 6px 14px;
    border-radius: 5px;
    color: var(--blue);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: 0.03em;
  }

  .btn:hover {
    background: rgba(137,180,250,0.18);
    border-color: rgba(137,180,250,0.45);
  }

  .btn::before { content: "$ "; opacity: 0.5; }
  .btn.show { display: inline-block; }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    html, body { padding: 0; align-items: stretch; }

    .window {
      border-radius: 0;
      border-left: none;
      border-right: none;
      height: 100svh;
    }

    .ts { display: none; }

    /* sur mobile l'indent disparaît puisque ts est caché */
    .prog-indent { width: calc(7ch + 8px); }
  }
</style>
</head>

<body>
<div class="window">
  <div class="titlebar">
    <div class="dots">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
    </div>
    <div class="title-label">bash — dumb-program</div>
  </div>

  <div class="terminal" id="terminal">
    <span class="cursor" id="cursor"></span>
  </div>

  <div class="actions">
    <button class="btn" id="retryBtn" onclick="start()">retry</button>
  </div>
</div>

<script>
const terminal = document.getElementById("terminal");
const retryBtn = document.getElementById("retryBtn");
const cursor   = document.getElementById("cursor");

const TOTAL   = 5;   // 4 erreurs + 1 succès
const BAR_W   = 18;  // largeur barre en caractères

const attempts = [
  ["Initialisation du programme",  "Chargement des modules essentiels…", "Connexion aux services…",         "Démarrage des dépendances…"],
  ["Initialisation du moteur",     "Chargement des plugins…",            "Connexion à la base de données…", "Démarrage des services…"],
  ["Boot du système",              "Chargement des modules…",            "Vérification de la connexion…",   "Contrôle des dépendances…"],
  ["Redémarrage du programme",     "Restauration du dernier état…",      "Reconnexion aux services…",       "Initialisation finale…"]
];

const errors = [
  { code: "TypeError",              text: "unsupported operand type(s) for +: 'me' and 'loneliness'", punchline: "J'ai besoin de toi pour corriger ça."   },
  { code: "AttributeError",         text: "'heart' object has no attribute 'control'",                punchline: "Depuis que je t'ai vu, c'est le chaos ici."         },
  { code: "500 Internal Server Error", text: "unexpected input",                      punchline: "Désolée, mon cœur bug quand tu me regardes."        },
  { code: "403 Forbidden",          text: "access denied",                         punchline: "C'est interdit d'être aussi séduisant que toi ou quoi ?"       }
];

let step = 0;

const now = () => new Date().toLocaleTimeString('fr-FR', { hour12: false });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ins   = el => terminal.insertBefore(el, cursor);

function bar(pct) {
  const f = Math.round(pct / 100 * BAR_W);
  return "[" + "█".repeat(f) + "░".repeat(BAR_W - f) + "]";
}

async function log(level, msg) {
  const el = document.createElement("div");
  el.className = "line";
  el.innerHTML =
    `<span class="ts">${now()}</span>` +
    `<span class="badge badge-${level}">${level}</span>` +
    `<span class="msg">${msg}</span>`;
  ins(el);
  await sleep(20);
  el.classList.add("visible");
  terminal.scrollTop = terminal.scrollHeight;
}

async function progress(duration) {
  const row    = document.createElement("div");
  row.className = "prog-line";

  const indent = document.createElement("span");
  indent.className = "prog-indent";
  indent.textContent = now() + "  INFO   "; // invisible mais même largeur

  const barEl = document.createElement("span");
  barEl.className = "prog-bar";
  barEl.textContent = bar(0);

  const pctEl = document.createElement("span");
  pctEl.className = "prog-pct";
  pctEl.textContent = "0%";

  row.appendChild(indent);
  row.appendChild(barEl);
  row.appendChild(pctEl);
  ins(row);

  await sleep(20);
  row.classList.add("visible");

  const start = Date.now();
  while (true) {
    const pct = Math.min(100, Math.round((Date.now() - start) / duration * 100));
    barEl.textContent = bar(pct);
    pctEl.textContent = pct + "%";
    terminal.scrollTop = terminal.scrollHeight;
    if (pct >= 100) break;
    await sleep(40);
  }
  pctEl.textContent = "OK";
  pctEl.style.color = "var(--green)";
  terminal.scrollTop = terminal.scrollHeight;
}

async function punchline(text, success) {
  await sleep(350);
  const cls = success ? "ok" : "err";
  const el  = document.createElement("div");
  el.className = "punchline";
  el.innerHTML =
    `<span class="punchline-icon ${cls}">${success ? "✓" : "✗"}</span>` +
    `<span class="punchline-text ${cls}">${text}</span>`;
  ins(el);
  await sleep(30);
  el.classList.add("visible");
  terminal.scrollTop = terminal.scrollHeight;
}

async function start() {
  while (terminal.firstChild !== cursor) terminal.removeChild(terminal.firstChild);
  retryBtn.classList.remove("show");
  cursor.classList.add("visible");

  const n    = step + 1;
  const msgs = attempts[step % attempts.length];

  await log("INFO", `Tentative ${n}/${TOTAL} — démarrage…`);
  await sleep(180);

  for (const msg of msgs) {
    await log("INFO", msg);
    await progress(850 + Math.random() * 550);
  }

  await sleep(280);

  if (step < errors.length) {
    const err = errors[step];
    await log("ERROR", `${err.code}: ${err.text}`);
    cursor.classList.remove("visible");
    await punchline(err.punchline, false);
    retryBtn.classList.add("show");
    step++;
  } else {
    await log("SUCCESS", "connection established — all systems nominal");
    cursor.classList.remove("visible");
    await punchline("On dirait que ça colle bien entre nous.", true);
    step = 0;
  }
}

start();
</script>
</body>
</html>
