<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>dumb-program IDE</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d1117;
    height: 100vh;
    display: flex;
    font-family: 'SF Mono', monospace;
    color: #c9d1d9;
  }

  /* Sidebar */
  .sidebar {
    width: 60px;
    background: #010409;
    border-right: 1px solid #30363d;
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    height: 40px;
    background: #161b22;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #30363d;
    justify-content: space-between;
  }

  .tabs {
    display: flex;
    gap: 8px;
  }

  .tab {
    background: #0d1117;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid #30363d;
  }

  .run-btn {
    background: #238636;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-size: 12px;
  }

  .run-btn:hover {
    background: #2ea043;
  }

  /* Editor + terminal */
  .content {
    display: flex;
    flex: 1;
  }

  .editor {
    flex: 1;
    padding: 20px;
    color: #6e7681;
  }

  .terminal {
    width: 50%;
    background: #010409;
    border-left: 1px solid #30363d;
    padding: 16px;
    font-size: 13px;
    overflow: hidden;
  }

  .log-line {
    opacity: 0;
    transform: translateY(4px);
    transition: 0.2s;
    white-space: pre;
  }

  .visible {
    opacity: 1;
    transform: translateY(0);
  }

  .info { color: #58a6ff; }
  .error { color: #f85149; }
  .success { color: #3fb950; }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: #58a6ff;
    animation: blink 1s infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>

<body>

<div class="sidebar"></div>

<div class="main">

  <div class="topbar">
    <div class="tabs">
      <div class="tab">main.py</div>
      <div class="tab">terminal</div>
    </div>
    <button class="run-btn" onclick="start()">▶ Run</button>
  </div>

  <div class="content">
    <div class="editor">
<pre>
def fix_life():
    me = "loneliness"
    you = "❤️"

    return me + you
</pre>
    </div>

    <div class="terminal" id="terminal"></div>
  </div>
</div>

<script>

const sequences = [
  [
    { type: "info", text: "Running program..." },
    { type: "error", text: "TypeError: unsupported operand type(s) for +: 'me' and 'loneliness'" },
    { type: "error", text: "Je pense que j’ai besoin de toi pour corriger ça." },
  ],
  [
    { type: "info", text: "Retrying..." },
    { type: "error", text: "AttributeError: 'heart' object has no attribute 'control'" },
    { type: "error", text: "Depuis que je t’ai vu, c’est le chaos." },
  ],
  [
    { type: "info", text: "Retrying..." },
    { type: "error", text: "500 Internal Server Error" },
    { type: "error", text: "Désolé, mon cœur bug quand tu me regardes." },
  ],
  [
    { type: "info", text: "Retrying..." },
    { type: "error", text: "403 Forbidden" },
    { type: "error", text: "C’est interdit d’être aussi séduisant que toi ou quoi ?" },
  ],
  [
    { type: "info", text: "Final attempt..." },
    { type: "success", text: "Success: connection established" },
    { type: "success", text: "On dirait que ça colle bien entre nous." },
  ]
];

let terminal = document.getElementById("terminal");

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function printLine(text, type) {
  const line = document.createElement("div");
  line.className = "log-line " + type;
  line.textContent = text;
  terminal.appendChild(line);

  await sleep(50);
  line.classList.add("visible");

  terminal.scrollTop = terminal.scrollHeight;
}

async function start() {
  terminal.innerHTML = "";

  for (let seq of sequences) {
    for (let line of seq) {
      await printLine(line.text, line.type);
      await sleep(800);
    }
    await sleep(1000);
  }

  const cursor = document.createElement("div");
  cursor.className = "log-line visible";
  cursor.innerHTML = '<span class="cursor"></span>';
  terminal.appendChild(cursor);
}

</script>

</body>
</html>
